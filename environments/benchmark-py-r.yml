# Main analysis environment for the majority of the analysis (not only the benchmark)
name: benchmark-py-r
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - anndata
  - scanpy
  - scvi-tools
  - h5py
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - scikit-misc         
  - numba
  - leidenalg
  - python-igraph
  - matplotlib
  - seaborn
  - ipython
  - bbknn             
  - rpy2                
  - sra-tools
  - pytorch=2.13.0=cuda129*
  - cuda-version=12.9
  - torchvision
  - torchaudio

  - r-base>=4.4
  - r-seurat            
  - r-seuratobject
  - r-matrix
  - r-rlang
  - r-optparse
  - r-remotes
  - r-dynutils
  - r-hmisc
  - r-ggimage
  - r-tibble
  - r-rcolorbrewer
  - r-stringr
  - r-plyr
  - r-ggplot2
  - r-cowplot
  - r-dplyr
  - r-scales
  - r-ggforce
  - bioconductor-singlecellexperiment
  - bioconductor-batchelor         
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-scuttle
  - bioconductor-biocparallel
  - bioconductor-biocgenerics
  - bioconductor-summarizedexperiment
  - bioconductor-s4vectors
  - bioconductor-iranges
  - bioconductor-delayedarray
  - bioconductor-delayedmatrixstats
  - bioconductor-biocneighbors
  - bioconductor-biocsingular
  - bioconductor-zellkonverter
  - bioconductor-rhdf5
  - bioconductor-hdf5array
  - pip
  - pip:
      - tqdm==4.68.4
      - celltypist==1.7.1
      - drvi-py==0.2.7
      - scib==1.1.7
      - scrublet==0.2.3
      - gseapy==1.3.0
      - gprofiler-official==1.0.0
      - decoupler==2.3.1
      - scanorama==1.7.4
      - harmony-pytorch==0.1.8
      - anndata2ri==2.0

